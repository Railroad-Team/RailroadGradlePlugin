plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'dev.railroadide'
version = '1.0.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Gradle version the tooling-API tests build against. The plugin's own wrapper is older than the Gradle 9
    // project-lock rules the tests guard, so default to a Gradle 9 release.
    systemProperty 'railroad.test.gradleVersion', providers.gradleProperty('railroadTestGradleVersion').getOrElse('9.7.0')
    testLogging {
        exceptionFormat = 'full'
        events 'failed'
    }
}

gradlePlugin {
    plugins {
        railroadProjectPlugin {
            id = 'dev.railroadide.railroadgradleplugin'
            displayName = 'Railroad IDE Project Plugin'
            description = 'Registers Railroad tooling models and documentation download tasks.'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadProjectPlugin'
        }
        railroadSettingsPlugin {
            id = 'dev.railroadide.railroadgradleplugin.settings'
            displayName = 'Railroad IDE Settings Plugin'
            description = 'Captures Fabric Loom version during plugin management resolution.'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadSettingsPlugin'
        }
    }
}

publishing {
    repositories {
        mavenLocal()
        maven {
            url "https://maven.railroadide.dev/releases"
            credentials {
                username = System.getenv("RAILROAD_MAVEN_USERNAME")
                password = System.getenv("RAILROAD_MAVEN_PASSWORD")
            }
        }
    }
}
