plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'dev.railroadide'
version = '1.0.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

gradlePlugin {
    plugins {
        railroadProjectPlugin {
            id = 'dev.railroadide.railroadgradleplugin'
            displayName = 'Railroad IDE Project Plugin'
            description = 'Registers Railroad tooling models and documentation download tasks.'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadProjectPlugin'
        }
        railroadSettingsPlugin {
            id = 'dev.railroadide.railroadgradleplugin.settings'
            displayName = 'Railroad IDE Settings Plugin'
            description = 'Captures Fabric Loom version during plugin management resolution.'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadSettingsPlugin'
        }
    }
}

publishing {
    repositories {
        mavenLocal()
        maven {
            url "https://maven.railroadide.dev/releases"
            credentials {
                username = System.getenv("RAILROAD_MAVEN_USERNAME")
                password = System.getenv("RAILROAD_MAVEN_PASSWORD")
            }
        }
    }
}
