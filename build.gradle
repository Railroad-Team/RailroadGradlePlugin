plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'dev.railroadide'
version = '1.2.1'
description = 'Railroad Gradle plugin'

base {
    archivesName = 'railroad-plugin'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

gradlePlugin {
    plugins {
        railroad {
            id = 'dev.railroadide.railroadgradleplugin'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadProjectPlugin'
            displayName = 'Railroad plugin'
            description = 'Exposes tasks to help with Railroad IDE integration.'
            tags.set(['railroad', 'ide', 'integration'])
        }

        railroadSettings {
            id = 'dev.railroadide.railroadgradleplugin.settings'
            implementationClass = 'dev.railroadide.railroadplugin.RailroadSettingsPlugin'
            displayName = 'Railroad settings plugin'
            description = 'Configures Railroad IDE integration at the settings level.'
            tags.set(['railroad', 'ide', 'integration', 'settings'])
        }
    }
}

publishing {
    publications {
        withType(MavenPublication).configureEach {
            artifactId = 'railroad-gradle-plugin'
        }
    }

    repositories {
        mavenLocal()
        maven {
            url "https://maven.railroadide.dev/releases"
            credentials {
                username = System.getenv("RAILROAD_MAVEN_USERNAME")
                password = System.getenv("RAILROAD_MAVEN_PASSWORD")
            }
        }
    }
}
